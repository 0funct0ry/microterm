# cargo-about configuration for THIRD-PARTY-LICENSES.html (SPEC §15.6).
# `accepted` mirrors the licence allow list in deny.toml.
accepted = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0", "OFL-1.1",
  "BSL-1.0", "0BSD", "NCSA", "CDLA-Permissive-2.0", "OpenSSL",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true
workarounds = ["ring"]

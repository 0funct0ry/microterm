[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"
# Only fail on unmaintained crates we depend on directly. gpui's transitive tree contains a few
# (ttf-parser, rustybuzz, paste, ...) that we cannot replace; real vulnerabilities still fail.
unmaintained = "workspace"
ignore = [
  # Marvin attack on RSA (via russh's RSA key support, used by mt_ssh). No patched `rsa` exists.
  # It needs an attacker who can time many RSA *private-key* operations over the network; the
  # SSH client only signs during its own authentication. Re-check when `rsa` ships a fix, or
  # drop russh's `rsa` feature if RSA keys stop mattering.
  "RUSTSEC-2023-0071",
  # `ttf-parser` is unmaintained (no vulnerability). mt_export uses it directly to read Noto Color
  # Emoji CBDT strikes, and fontdue/fontdb/rustybuzz (gpui's tree) depend on it too, so it cannot
  # be dropped. Re-check when moving mt_export to `skrifa`.
  "RUSTSEC-2026-0192",
]

[licenses]
version = 2
# `rustyline` (MIT) powers `microterm sh` (feature `sh`); its dependencies are all covered below.
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0", "OFL-1.1",
  "BSL-1.0", "0BSD", "NCSA", "CDLA-Permissive-2.0", "OpenSSL",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"

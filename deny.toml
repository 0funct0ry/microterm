[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"
# Only fail on unmaintained crates we depend on directly. gpui's transitive tree contains a few
# (ttf-parser, rustybuzz, paste, ...) that we cannot replace; real vulnerabilities still fail.
unmaintained = "workspace"

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0", "OFL-1.1",
  "BSL-1.0", "0BSD", "NCSA", "CDLA-Permissive-2.0", "OpenSSL",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"

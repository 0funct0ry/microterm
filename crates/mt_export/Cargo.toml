[package]
name = "mt_export"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
mt_record = { path = "../mt_record" }
mt_config = { path = "../mt_config" }
thiserror = { workspace = true }
serde_json = "1"
mt_term = { path = "../mt_term" }
mt_theme = { path = "../mt_theme" }
# GIF exporter (SPEC §10.10.6): pure-Rust rasteriser and encoder.
fontdue = "0.9"
gif = "0.14"
# Colour emoji: Noto Color Emoji is a CBDT (PNG strikes) font that fontdue cannot draw.
ttf-parser = "0.25"
png = "0.17"

[dev-dependencies]
tempfile = "3"

[package]
name = "mt_ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Compile Metal shaders at runtime instead of build time. Lets macOS builds work with only the
# Command Line Tools installed (no Xcode / Metal toolchain). The Makefile enables it when
# `xcrun metal` is missing.
runtime-shaders = ["gpui/runtime_shaders"]

[dependencies]
gpui.workspace = true
nucleo-matcher.workspace = true
mt_term = { path = "../mt_term" }
mt_config = { path = "../mt_config" }
mt_theme = { path = "../mt_theme" }
mt_mux = { path = "../mt_mux" }
mt_patterns = { path = "../mt_patterns" }
async-channel = "2"
anyhow = "1"
fontdb = "0.24.0"
skrifa = "0.48.0"
serde_json = "1"
toml.workspace = true
regex.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

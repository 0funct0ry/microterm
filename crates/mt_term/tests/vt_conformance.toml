# Work list for M10.6: every sequence in Ghostty's VT reference
# (https://ghostty.org/docs/vt/reference and /external).
# Each [[row]] is one sequence; each [[row.case]] feeds `input` to an emulator (20x5, One Dark
# palette) and asserts the optional fields. Statuses: supported | partial | unsupported.
# Rendered by `xtask gen-docs` into reference/terminal-api.md.

[[row]]
kind = "Control"
code = "BEL"
name = "Bell"
status = "supported"
url = "https://ghostty.org/docs/vt/control/bel"
  [[row.case]]
  input = "\u0007"
  events = ["bell"]

[[row]]
kind = "Control"
code = "BS"
name = "Backspace"
status = "supported"
url = "https://ghostty.org/docs/vt/control/bs"
  [[row.case]]
  input = "ab\b"
  cursor = [0, 1]
  [[row.case]]
  input = "\b"
  cursor = [0, 0]

[[row]]
kind = "Control"
code = "TAB"
name = "Horizontal tab"
status = "supported"
url = "https://ghostty.org/docs/vt/control/tab"
  [[row.case]]
  input = "\t"
  cursor = [0, 8]
  [[row.case]]
  input = "a\t\t"
  cursor = [0, 16]

[[row]]
kind = "Control"
code = "LF"
name = "Line feed"
status = "supported"
url = "https://ghostty.org/docs/vt/control/lf"
  [[row.case]]
  input = "a\n"
  cursor = [1, 1]

[[row]]

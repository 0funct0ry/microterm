[[row]]
kind = "CSI"
code = "CSI Pl ; Pr s"
name = "DECSLRM"
status = "unsupported"
notes = "alacritty_terminal has no left/right margins; see docs/adr/0002-decslrm-margins.md. With mode 69 unset `CSI s` stays save-cursor and DECRQM reports mode 69 as not recognised."
url = "https://ghostty.org/docs/vt/csi/decslrm"
  [[row.case]]
  input = "\u001b[?69$p"
  reply = "\u001b[?69;0$y"
  [[row.case]]
  input = "\u001b[3;4H\u001b[s\u001b[1;1H\u001b[u"
  cursor = [2, 3]
  [[row.case]]
  input = "\u001b[?69h\u001b[2;5sabcdefgh"
  lines = ["abcdefgh"]

[[row]]
kind = "CSI"
code = "CSI ? Pm $ p"
name = "DECRQM (SGR-pixels, 1016)"
status = "supported"
notes = "Only mode 1016 is answered by microterm itself; other private modes are answered by the engine (1015, 47 and 1047 are not implemented and report 0)."
url = "https://ghostty.org/docs/vt/csi/xtshiftescape"
  [[row.case]]
  input = "\u001b[?1016$p"
  reply = "\u001b[?1016;2$y"
  [[row.case]]
  input = "\u001b[?1016h\u001b[?1016$p"
  reply = "\u001b[?1016;1$y"
  [[row.case]]
  input = "\u001b[?1016h\u001b[?1016l\u001b[?1016$p"
  reply = "\u001b[?1016;2$y"
  [[row.case]]
  input = "\u001b[?1006;1016h\u001b[?1016$p"
  reply = "\u001b[?1016;1$y"
  [[row.case]]
  input = "\u001b[?1016h\u001b[?1000h\u001b[?1016$p\u001b[?1000$p"
  reply = "\u001b[?1016;1$y\u001b[?1000;1$y"
  [[row.case]]
  input = "\u001b[?1016h\u001bc\u001b[?1016$p"
  reply = "\u001b[?1016;2$y"
  [[row.case]]
  input = "\u001b[?1015$p"
  reply = "\u001b[?1015;0$y"

[[row]]
kind = "CSI"
code = "CSI > Pn q"
name = "XTVERSION"
status = "supported"
notes = "Replies `DCS > | microterm <version> ST`. Not in Ghostty's reference list; Ghostty answers it the same way."
url = "https://invisible-island.net/xterm/ctlseqs/ctlseqs.html"
  [[row.case]]
  input = "\u001b[>q"
  reply = "\u001bP>|microterm {version}\u001b\\"
  [[row.case]]
  input = "\u001b[>0q"
  reply = "\u001bP>|microterm {version}\u001b\\"
  [[row.case]]
  input = "\u001b[>1q"
  reply = ""
  [[row.case]]
  input = "\u001b[>q\u001b[>0q"
  reply = "\u001bP>|microterm {version}\u001b\\\u001bP>|microterm {version}\u001b\\"
  [[row.case]]
  input = "\u001b[q"
  reply = ""


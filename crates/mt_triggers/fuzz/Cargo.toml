[package]
name = "mt_triggers-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
mt_triggers = { path = ".." }

# Not part of the main workspace (run with `cargo fuzz run template` from crates/mt_triggers).
[workspace]

[[bin]]
name = "template"
path = "fuzz_targets/template.rs"
test = false
doc = false

[package]
name = "microterm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "microterm"
path = "src/lib.rs"

[[bin]]
name = "microterm"
path = "src/main.rs"

[features]
default = ["sh"]
runtime-shaders = ["mt_ui/runtime-shaders"]
# `microterm sh`, the interactive control shell (SPEC §12.7).
sh = ["dep:rustyline"]

[dependencies]
clap.workspace = true
mt_ui = { path = "../mt_ui" }
mt_config = { path = "../mt_config" }
mt_theme = { path = "../mt_theme" }
mt_proto = { path = "../mt_proto" }
mt_snippets = { path = "../mt_snippets" }
mt_mux = { path = "../mt_mux" }
mt_term = { path = "../mt_term" }
mt_record = { path = "../mt_record" }
mt_serial = { path = "../mt_serial" }
clap_complete = "4"
async-channel.workspace = true
serde_json = "1"
serde.workspace = true
libc = "0.2"
rustyline = { version = "17", optional = true }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true

[package]
name = "microterm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "microterm"
path = "src/main.rs"

[features]
runtime-shaders = ["mt_ui/runtime-shaders"]

[dependencies]
clap.workspace = true
mt_ui = { path = "../mt_ui" }
mt_config = { path = "../mt_config" }
mt_theme = { path = "../mt_theme" }
async-channel.workspace = true
serde_json = "1"
libc = "0.2"

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true

[package]
name = "mt_snippets"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Snippets model, snippets.toml store and the {{ }} template engine (no GPUI)"

[dependencies]
mt_config = { path = "../mt_config" }
serde.workspace = true
toml.workspace = true
toml_edit.workspace = true
strsim.workspace = true
thiserror.workspace = true
uuid = { version = "1", features = ["v4", "v7"] }
ulid = "1"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
percent-encoding = "2"
libc = "0.2"

[dev-dependencies]
proptest = "1"
tempfile = "3"

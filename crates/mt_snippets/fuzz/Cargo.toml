[package]
name = "mt_snippets-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
mt_snippets = { path = ".." }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false

# Not part of the microterm workspace: fuzzing needs nightly (`cargo +nightly fuzz run parse`).
[workspace]

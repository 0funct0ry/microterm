[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/0funct0ry/microterm"

[workspace.dependencies]
# gpui is pre-1.0 and its API churns between releases, so it is pinned to an exact
# crates.io version (not a Zed git rev: reproducible, small clone, simple CI). Only
# `mt_ui` may depend on it. Upgrade deliberately and re-run the UI tests.
gpui = "=0.2.2"
clap = { version = "4", features = ["derive"] }
nucleo-matcher = "0.3"
assert_cmd = "2"
predicates = "3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
strsim = "0.11"
thiserror = "2"
notify = "8"
async-channel = "2"
regex = "1"

# GIF export is CPU-bound pixel work (SPEC §10.10.6): without this a `make run` (debug) export of
# a large recording takes minutes. Only the crates on that path are optimised in dev builds.
[profile.dev.package.mt_export]
opt-level = 3
[profile.dev.package.fontdue]
opt-level = 3
[profile.dev.package.gif]
opt-level = 3
[profile.dev.package.weezl]
opt-level = 3
[profile.dev.package.ttf-parser]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

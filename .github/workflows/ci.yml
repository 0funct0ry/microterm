name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake pkg-config libssl-dev libfontconfig-dev libasound2-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev \
            libx11-xcb-dev libvulkan-dev mesa-vulkan-drivers libzstd-dev

      # rust-toolchain.toml pins the version and components (rustfmt, clippy).
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # fmt check, clippy -D warnings, cargo-deny and the alacritty_terminal facade grep.
      - run: make lint
      - run: make test
      # Bundled themes: licence, 16 colours, >= 4.5:1 contrast.
      - run: make themes
      # Generated docs (reference/actions.md) must match the action registry.
      - run: make docs-check

  site:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: make site-build

  # Real SSH against a Docker openssh-server: auth (key, password), host keys, bootstrap from an
  # empty home, and kill-the-connection-then-reconnect (SPEC §14).
  ssh-integration:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      # The container is x86_64 Linux, so it gets the static musl build of the daemon.
      - run: cargo build --release -p mt_mux_server --target x86_64-unknown-linux-musl
      - run: make test-ssh
        env:
          MICROTERM_MUX_BINARY: ${{ github.workspace }}/target/x86_64-unknown-linux-musl/release/microterm-mux
